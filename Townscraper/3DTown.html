<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>3D Wedding Invitation</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,0.16), transparent 42%),
        linear-gradient(180deg, #2f8f9a 0%, #1c7380 100%);
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #canvas-wrap canvas {
      filter: saturate(1.02) brightness(1.04) contrast(1.04);
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,0.18), transparent 42%),
        linear-gradient(180deg, #2f8f9a 0%, #1c7380 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }

    #title-card {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: min(90vw, 430px);
      padding: 24px 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      box-shadow: 0 16px 45px rgba(0, 40, 45, 0.28);
      display: none;
      border: 1px solid rgba(255,255,255,0.72);
    }

    #title-card h1 {
      margin: 0 0 9px;
      font-size: 31px;
      font-weight: normal;
      color: #1f1b18;
      letter-spacing: 0.2px;
    }

    #title-card p {
      margin: 0;
      font-size: 15.5px;
      line-height: 1.5;
      color: #2c2723;
    }

    .hotspot {
      position: fixed;
      z-index: 15;
      transform: translate(-50%, -50%);
      padding: 9px 15px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 40, 45, 0.24);
      display: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.8);
      color: #1f1b18;
      user-select: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .hotspot:hover {
      background: rgba(255, 248, 238, 0.98);
      transform: translate(-50%, -50%) scale(1.04);
    }

    #popup {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(32, 26, 21, 0.35);
      padding: 20px;
    }

    #popup-card {
      width: min(90vw, 430px);
      padding: 30px 28px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.96);
      text-align: center;
      box-shadow: 0 22px 65px rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.8);
    }

    #popup-card h2 {
      margin: 0 0 12px;
      font-weight: normal;
      font-size: 27px;
      color: #1f1b18;
    }

    #popup-card p {
      margin: 0;
      font-size: 16px;
      line-height: 1.55;
      color: #312b26;
    }

    #popup-card button {
      margin-top: 22px;
      padding: 11px 20px;
      border: none;
      border-radius: 999px;
      background: #2b2520;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
    }

    #error {
      position: fixed;
      z-index: 200;
      left: 20px;
      right: 20px;
      bottom: 20px;
      display: none;
      padding: 14px 16px;
      background: rgba(120, 0, 0, 0.9);
      color: white;
      border-radius: 14px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      #title-card {
        bottom: 18px;
        padding: 20px 18px;
      }

      #title-card h1 {
        font-size: 27px;
      }

      #title-card p {
        font-size: 14.5px;
      }

      .hotspot {
        font-size: 13px;
        padding: 8px 13px;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="canvas-wrap"></div>

  <div id="loader">Loading the village...</div>

  <div id="title-card">
    <h1>Ralph & Roussana</h1>
    <p>Welcome to our 3D wedding invitation.<br>Drag to explore the village.</p>
  </div>

  <div class="hotspot" id="hotspot-ceremony">Ceremony</div>
  <div class="hotspot" id="hotspot-reception">Reception</div>
  <div class="hotspot" id="hotspot-rsvp">RSVP</div>

  <div id="popup">
    <div id="popup-card">
      <h2 id="popup-title"></h2>
      <p id="popup-text"></p>
      <button onclick="closePopup()">Close</button>
    </div>
  </div>

  <div id="error"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

    const ASSET_PATH = "https://raw.githubusercontent.com/NemerDavid/Tempo/main/Townscraper/assets/";

    const container = document.getElementById("canvas-wrap");
    const loader = document.getElementById("loader");
    const errorBox = document.getElementById("error");
    const titleCard = document.getElementById("title-card");

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );

    camera.position.set(35, 28, 45);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.target.set(0, 0, 0);
    controls.minDistance = 18;
    controls.maxDistance = 115;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.enablePan = false;

    const ambient = new THREE.AmbientLight(0xffffff, 3.9);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffe2bd, 1.65);
    sun.position.set(35, 55, 35);
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xbdefff, 1.05);
    fill.position.set(-35, 25, -30);
    scene.add(fill);

    const hotspots = [
      {
        element: document.getElementById("hotspot-ceremony"),
        position: new THREE.Vector3(8, 5.4, -5),
        title: "Ceremony",
        text: "St. Marina Church — ceremony details can go here."
      },
      {
        element: document.getElementById("hotspot-reception"),
        position: new THREE.Vector3(1, 6.1, 2.5),
        title: "Reception",
        text: "Splend’Or Venue — reception details can go here."
      },
      {
        element: document.getElementById("hotspot-rsvp"),
        position: new THREE.Vector3(-7, 5.2, 2),
        title: "RSVP",
        text: "The RSVP form can open here."
      }
    ];

    hotspots.forEach((hotspot) => {
      hotspot.element.addEventListener("click", () => {
        openPopup(hotspot.title, hotspot.text);
      });
    });

    function showError(message) {
      loader.style.display = "none";
      errorBox.style.display = "block";
      errorBox.textContent = message;
      console.error(message);
    }

    function clamp(v) {
      return Math.max(0, Math.min(255, v));
    }

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    function shadeColor(target, lum, contrast = 1) {
      const f = 0.62 + Math.pow(lum / 255, 0.9) * 0.72 * contrast;
      return [
        clamp(target[0] * f),
        clamp(target[1] * f),
        clamp(target[2] * f)
      ];
    }

    function makeTownscaperGameTexture(image) {
      const canvas = document.createElement("canvas");
      canvas.width = image.width;
      canvas.height = image.height;

      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(image, 0, 0);

      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = img.data;
      const w = canvas.width;

      const palette = {
        wallRed: [240, 76, 86],
        wallShadow: [194, 62, 74],

        roofGold: [246, 189, 103],
        roofShadow: [205, 128, 85],

        water: [46, 147, 158],
        waterDark: [28, 94, 106],
        waterLight: [118, 211, 219],

        stoneWall: [126, 145, 129],
        stoneWallDark: [87, 113, 104],
        stoneWallLight: [179, 188, 164],
        stoneTop: [207, 195, 168],
        stoneCream: [239, 222, 184],
        stoneWarm: [218, 176, 145],

        sand: [232, 187, 152],
        treeGreen: [98, 159, 111],
        dark: [28, 43, 48],
        white: [238, 240, 231]
      };

      for (let i = 0; i < data.length; i += 4) {
        const pixel = i / 4;
        const x = pixel % w;
        const y = Math.floor(pixel / w);

        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];
        let a = data[i + 3];

        if (a < 20) {
          data[i + 3] = 0;
          continue;
        }

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        const sat = max === 0 ? 0 : (max - min) / max;

        let target = null;
        let amount = 0.88;

        const isWater = g > 80 && b > 90 && r < g * 0.86 && r < b * 0.9;
        const isNeonGreen = g > 145 && g > r * 1.18 && g > b * 1.08;
        const isRed = r > 105 && r > g * 1.16 && r > b * 1.1;
        const isPurpleBlue = (b > 90 && r > 65 && sat > 0.25) || (r > 100 && b > 100 && g < 130);
        const isGrey = sat < 0.22;

        if (isWater) {
          target = lum < 85 ? palette.waterDark : lum > 170 ? palette.waterLight : palette.water;
          amount = 0.82;
        }

        else if (isNeonGreen) {
          // Townscaper exports many platform/wall pixels as neon green.
          // Here we convert them to Townscaper-like limestone / green-grey stone.
          if (lum > 205) {
            target = palette.stoneCream;
            amount = 0.96;
          } else if (lum > 160) {
            target = palette.stoneTop;
            amount = 0.94;
          } else if (lum > 115) {
            target = palette.stoneWallLight;
            amount = 0.93;
          } else if (lum > 75) {
            target = palette.stoneWall;
            amount = 0.92;
          } else {
            target = palette.stoneWallDark;
            amount = 0.9;
          }
        }

        else if (y < 62 && x > 58) {
          target = lum < 95 ? palette.roofShadow : palette.roofGold;
          amount = 0.9;
        }

        else if ((x < 70 && y > 50 && y < 98) || isPurpleBlue) {
          target = lum < 90 ? palette.wallShadow : palette.wallRed;
          amount = 0.86;
        }

        else if (isRed) {
          target = lum > 145 ? palette.wallRed : palette.wallShadow;
          amount = 0.76;
        }

        else if (lum < 44) {
          target = palette.dark;
          amount = 0.72;
        }

        else if (isGrey) {
          if (lum > 185) {
            target = palette.stoneCream;
            amount = 0.66;
          } else if (lum > 135) {
            target = palette.stoneTop;
            amount = 0.62;
          } else if (lum > 85) {
            target = palette.stoneWall;
            amount = 0.6;
          } else {
            target = palette.stoneWallDark;
            amount = 0.58;
          }
        }

        else {
          target = lum > 150 ? palette.sand : palette.wallRed;
          amount = 0.44;
        }

        const shaded = shadeColor(target, lum, 1.06);

        r = mix(r, shaded[0], amount);
        g = mix(g, shaded[1], amount);
        b = mix(b, shaded[2], amount);

        const gray = 0.299 * r + 0.587 * g + 0.114 * b;

        r = gray + (r - gray) * 1.05;
        g = gray + (g - gray) * 1.03;
        b = gray + (b - gray) * 1.04;

        r = r * 1.035 + 4;
        g = g * 1.025 + 2;
        b = b * 1.02;

        data[i] = clamp(r);
        data[i + 1] = clamp(g);
        data[i + 2] = clamp(b);
        data[i + 3] = a;
      }

      ctx.putImageData(img, 0, 0);

      const processedTexture = new THREE.CanvasTexture(canvas);
      processedTexture.colorSpace = THREE.SRGBColorSpace;
      processedTexture.magFilter = THREE.NearestFilter;
      processedTexture.minFilter = THREE.NearestFilter;
      processedTexture.generateMipmaps = false;
      processedTexture.needsUpdate = true;

      return processedTexture;
    }

    function addGameEdges(root) {
      const edgeMaterial = new THREE.LineBasicMaterial({
        color: 0x123540,
        transparent: true,
        opacity: 0.34,
        depthTest: true
      });

      root.traverse((child) => {
        if (!child.isMesh || !child.geometry) return;

        const edges = new THREE.EdgesGeometry(child.geometry, 28);
        const lines = new THREE.LineSegments(edges, edgeMaterial);
        lines.renderOrder = 3;
        child.add(lines);
      });
    }

    function createSoftShadow(box) {
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const shadowCanvas = document.createElement("canvas");
      shadowCanvas.width = 512;
      shadowCanvas.height = 512;

      const ctx = shadowCanvas.getContext("2d");
      const gradient = ctx.createRadialGradient(256, 256, 60, 256, 256, 255);
      gradient.addColorStop(0, "rgba(0, 42, 48, 0.22)");
      gradient.addColorStop(0.45, "rgba(0, 42, 48, 0.13)");
      gradient.addColorStop(1, "rgba(0, 42, 48, 0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 512);

      const shadowTexture = new THREE.CanvasTexture(shadowCanvas);
      shadowTexture.needsUpdate = true;

      const shadowMaterial = new THREE.MeshBasicMaterial({
        map: shadowTexture,
        transparent: true,
        depthWrite: false,
        opacity: 0.75
      });

      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(size.x * 1.55, size.z * 1.55),
        shadowMaterial
      );

      shadow.rotation.x = -Math.PI / 2;
      shadow.position.set(center.x, box.min.y - 0.03, center.z);
      shadow.renderOrder = -1;

      scene.add(shadow);
    }

    async function loadTown() {
      try {
        loader.textContent = "Loading texture...";

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin("anonymous");

        const originalTexture = await textureLoader.loadAsync(ASSET_PATH + "TownColor.png");
        const texture = makeTownscaperGameTexture(originalTexture.image);

        loader.textContent = "Loading the 3D village...";

        const objLoader = new OBJLoader();
        objLoader.setPath(ASSET_PATH);

        const town = await objLoader.loadAsync("Townacuj7r8YSSdYS3wl.obj");

        const material = new THREE.MeshBasicMaterial({
          map: texture,
          color: new THREE.Color("#ffffff"),
          side: THREE.DoubleSide,
          transparent: true,
          alphaTest: 0.15
        });

        town.traverse((child) => {
          if (child.isMesh) {
            child.material = material;
            child.geometry.computeVertexNormals();
          }
        });

        const box = new THREE.Box3().setFromObject(town);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        town.position.x -= center.x;
        town.position.y -= center.y;
        town.position.z -= center.z;

        const scale = 32 / maxDim;
        town.scale.setScalar(scale);

        scene.add(town);

        const scaledBox = new THREE.Box3().setFromObject(town);
        createSoftShadow(scaledBox);
        addGameEdges(town);

        camera.position.set(35, 28, 45);
        controls.target.set(0, 0, 0);
        controls.update();

        loader.style.display = "none";
        titleCard.style.display = "block";
      } catch (err) {
        showError(
          "The 3D town could not load. Please check that TownColor.png and Townacuj7r8YSSdYS3wl.obj are inside Townscraper/assets on GitHub. Open the browser console with F12 to see the exact error."
        );
        console.error(err);
      }
    }

    function updateHotspots() {
      hotspots.forEach((hotspot) => {
        const vector = hotspot.position.clone();
        vector.project(camera);

        const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;

        const visible =
          vector.z < 1 &&
          x > -100 &&
          x < window.innerWidth + 100 &&
          y > -100 &&
          y < window.innerHeight + 100;

        hotspot.element.style.left = `${x}px`;
        hotspot.element.style.top = `${y}px`;
        hotspot.element.style.display = visible ? "block" : "none";
      });
    }

    function openPopup(title, text) {
      document.getElementById("popup-title").textContent = title;
      document.getElementById("popup-text").textContent = text;
      document.getElementById("popup").style.display = "flex";
    }

    window.closePopup = function () {
      document.getElementById("popup").style.display = "none";
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateHotspots();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    loadTown();
    animate();
  </script>
</body>
</html>
