<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Wedding Invitation</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8ecfd6;
      font-family: Georgia, serif;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: linear-gradient(180deg, #8ecfd6, #f7e5d0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #2c2c2c;
    }

    #title-card {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      width: min(90vw, 420px);
      padding: 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    }

    #title-card h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: normal;
    }

    #title-card p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
    }

    .hotspot {
      position: fixed;
      z-index: 6;
      transform: translate(-50%, -50%);
      padding: 8px 14px;
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      display: none;
    }

    #popup {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
    }

    #popup-card {
      width: min(90vw, 430px);
      padding: 28px;
      border-radius: 24px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    #popup-card button {
      margin-top: 18px;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #222;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="canvas-wrap"></div>
  <div id="loader">Loading the village...</div>

  <div id="title-card">
    <h1>Ralph & Roussana</h1>
    <p>Welcome to our 3D wedding invitation.<br>Drag to explore the village.</p>
  </div>

  <div class="hotspot" id="hotspot-ceremony">Ceremony</div>
  <div class="hotspot" id="hotspot-reception">Reception</div>
  <div class="hotspot" id="hotspot-rsvp">RSVP</div>

  <div id="popup">
    <div id="popup-card">
      <h2 id="popup-title"></h2>
      <p id="popup-text"></p>
      <button onclick="closePopup()">Close</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.165.0/examples/jsm/controls/OrbitControls.js";
    import { MTLLoader } from "https://unpkg.com/three@0.165.0/examples/jsm/loaders/MTLLoader.js";
    import { OBJLoader } from "https://unpkg.com/three@0.165.0/examples/jsm/loaders/OBJLoader.js";

    const container = document.getElementById("canvas-wrap");
    const loader = document.getElementById("loader");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#8ecfd6");

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(35, 35, 45);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 5, 0);
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 15;
    controls.maxDistance = 90;

    const ambient = new THREE.AmbientLight(0xffffff, 2.5);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(20, 40, 30);
    scene.add(sun);

    let town;

    const mtlLoader = new MTLLoader();
    mtlLoader.setPath("./assets/");

    const materials = await mtlLoader.loadAsync("Town.mtl");
    materials.preload();

    const objLoader = new OBJLoader();
    objLoader.setMaterials(materials);
    objLoader.setPath("./assets/");

    town = await objLoader.loadAsync("Townacuj7r8YSSdYS3wl.obj");

    town.traverse((child) => {
      if (child.isMesh) {
        child.geometry.computeVertexNormals();

        const oldMaterial = child.material;
        const texture = oldMaterial && oldMaterial.map ? oldMaterial.map : null;

        if (texture) {
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.magFilter = THREE.NearestFilter;
          texture.minFilter = THREE.NearestFilter;
          texture.needsUpdate = true;

          child.material = new THREE.MeshBasicMaterial({
            map: texture,
            side: THREE.DoubleSide
          });
        }
      }
    });

    town.scale.set(1, 1, 1);
    town.position.set(0, 0, 0);
    scene.add(town);

    loader.style.display = "none";

    const hotspots = [
      {
        element: document.getElementById("hotspot-ceremony"),
        position: new THREE.Vector3(-6, 8, 2),
        title: "Ceremony",
        text: "St. Marina Church — ceremony details can go here."
      },
      {
        element: document.getElementById("hotspot-reception"),
        position: new THREE.Vector3(8, 6, 4),
        title: "Reception",
        text: "Splend’Or Venue — reception details can go here."
      },
      {
        element: document.getElementById("hotspot-rsvp"),
        position: new THREE.Vector3(0, 5, -8),
        title: "RSVP",
        text: "The RSVP form can open here."
      }
    ];

    hotspots.forEach((hotspot) => {
      hotspot.element.addEventListener("click", () => {
        openPopup(hotspot.title, hotspot.text);
      });
    });

    function updateHotspots() {
      hotspots.forEach((hotspot) => {
        const vector = hotspot.position.clone();
        vector.project(camera);

        const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;

        hotspot.element.style.left = `${x}px`;
        hotspot.element.style.top = `${y}px`;
        hotspot.element.style.display = vector.z < 1 ? "block" : "none";
      });
    }

    function openPopup(title, text) {
      document.getElementById("popup-title").textContent = title;
      document.getElementById("popup-text").textContent = text;
      document.getElementById("popup").style.display = "flex";
    }

    window.closePopup = function () {
      document.getElementById("popup").style.display = "none";
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateHotspots();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
